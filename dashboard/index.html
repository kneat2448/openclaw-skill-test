<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Peer Review Dashboard</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --panel: #ffffff;
        --ink: #111827;
        --muted: #5f6b7a;
        --line: #dbe2ea;
        --soft: #edf2f7;
        --accent: #0f766e;
        --warn: #b45309;
        --risk: #b91c1c;
      }

      * { box-sizing: border-box; }
      body { margin: 0; font-family: Arial, sans-serif; background: var(--bg); color: var(--ink); }
      main { max-width: 1180px; margin: 0 auto; padding: 28px 20px 40px; }
      header { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 18px; }
      h1 { margin: 0 0 8px; font-size: 28px; line-height: 1.2; }
      h2 { margin: 0 0 14px; font-size: 19px; }
      h3 { margin: 0 0 8px; font-size: 15px; }
      p { margin: 0 0 10px; }
      select, button {
        min-height: 38px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: white;
        color: var(--ink);
        font-size: 14px;
        padding: 8px 10px;
      }
      button { cursor: pointer; background: var(--accent); border-color: var(--accent); color: white; }
      table { width: 100%; border-collapse: collapse; background: white; }
      th, td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
      th { background: var(--soft); font-size: 12px; text-transform: uppercase; }
      .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
      .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-top: 16px; }
      .muted { color: var(--muted); }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
      .metric { background: #f9fafb; border: 1px solid var(--line); border-radius: 6px; padding: 12px; }
      .metric strong { display: block; font-size: 20px; margin-top: 4px; }
      .tag { display: inline-block; border: 1px solid var(--line); background: #f9fafb; border-radius: 999px; padding: 4px 8px; margin: 0 6px 6px 0; font-size: 12px; }
      .risk-high { color: var(--risk); font-weight: 700; }
      .risk-medium { color: var(--warn); font-weight: 700; }
      .risk-low { color: var(--accent); font-weight: 700; }
      .empty { padding: 14px; border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); background: #fbfcfd; }
      @media (max-width: 720px) {
        header { display: block; }
        .controls { justify-content: flex-start; margin-top: 14px; }
        select { width: 100%; }
        table { font-size: 13px; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1 id="title">Peer Review Dashboard</h1>
          <p id="meta" class="muted">Loading projects...</p>
        </div>
        <div class="controls">
          <select id="projectSelect" aria-label="Project"></select>
          <button id="refreshButton" type="button">Refresh</button>
        </div>
      </header>

      <section class="grid" id="summary"></section>

      <section class="panel">
        <h2>Team Matrix</h2>
        <table>
          <thead>
            <tr>
              <th>Member</th>
              <th>Responses</th>
              <th>Average</th>
              <th>Confidence</th>
              <th>Risk</th>
              <th>Strongest Signals</th>
              <th>Growth Signals</th>
            </tr>
          </thead>
          <tbody id="matrix"></tbody>
        </table>
      </section>

      <section class="panel">
        <h2>Narrative Report</h2>
        <div id="narrative"></div>
      </section>

      <section class="panel">
        <h2>Decision Scorecard</h2>
        <div id="scorecard" class="grid"></div>
      </section>
    </main>

    <script>
      const projectSelect = document.getElementById("projectSelect");
      const refreshButton = document.getElementById("refreshButton");
      const pathParts = location.pathname.split("/").filter(Boolean);
      const pathProjectId = pathParts[0] === "dashboard" && pathParts[1] ? pathParts[1] : "";

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        }[char]));
      }

      async function fetchJson(url) {
        const response = await fetch(url);
        const payload = await response.json().catch(() => ({}));
        if (!response.ok || payload.ok === false) throw new Error(payload.error || `Request failed: ${url}`);
        return payload;
      }

      async function loadProjects() {
        const { projects } = await fetchJson("/api/projects");
        const validProjects = projects.filter((project) => project && project.id != null);
        projectSelect.innerHTML = validProjects.map((project) => (
          `<option value="${project.id}">#${project.id} ${escapeHtml(project.name)} (${escapeHtml(project.status)})</option>`
        )).join("");

        if (!validProjects.length) {
          projectSelect.innerHTML = `<option value="">No projects</option>`;
          projectSelect.disabled = true;
          refreshButton.disabled = true;
          renderEmpty("No projects found yet. Create a project in Telegram first.");
          return;
        }

        projectSelect.disabled = false;
        refreshButton.disabled = false;
        const selectedId = pathProjectId && validProjects.some((project) => String(project.id) === String(pathProjectId))
          ? pathProjectId
          : validProjects[0].id;
        projectSelect.value = selectedId;
        await loadDashboard(selectedId);
      }

      async function loadDashboard(projectId) {
        if (!projectId) {
          renderEmpty("Select a project to load dashboard analysis.");
          return;
        }
        document.getElementById("meta").textContent = "Loading analysis...";
        try {
          const { dashboard } = await fetchJson(`/api/projects/${projectId}/dashboard`);
          renderDashboard(dashboard);
          if (String(pathProjectId) !== String(projectId)) {
            history.replaceState(null, "", `/dashboard/${projectId}`);
          }
        } catch (error) {
          renderEmpty(error.message);
        }
      }

      function renderDashboard(data) {
        document.title = `${data.project.name} - Peer Review Dashboard`;
        document.getElementById("title").textContent = data.project.name;
        document.getElementById("meta").textContent = `${data.coverage.submitted}/${data.coverage.total} reviews submitted`;
        document.getElementById("summary").innerHTML = `
          <div class="metric"><span class="muted">Coverage</span><strong>${data.coverage.submitted}/${data.coverage.total}</strong></div>
          <div class="metric"><span class="muted">Project average</span><strong>${data.analysis.projectAverage == null ? "No data" : data.analysis.projectAverage.toFixed(1)}</strong></div>
          <div class="metric"><span class="muted">Needs attention</span><strong>${data.analysis.needsAttention.length}</strong></div>
        `;
        document.getElementById("matrix").innerHTML = data.teamMatrix.map((row) => `
          <tr>
            <td>${escapeHtml(row.memberName)}</td>
            <td>${escapeHtml(row.responseDisplay)}</td>
            <td>${escapeHtml(row.averageDisplay)}</td>
            <td>${escapeHtml(row.confidence)}</td>
            <td class="${riskClass(row.risk)}">${escapeHtml(row.risk)}</td>
            <td>${renderDimensionTags(row.strongestDimensions)}</td>
            <td>${renderDimensionTags(row.growthDimensions)}</td>
          </tr>
        `).join("");
        document.getElementById("narrative").innerHTML = `
          <p>${escapeHtml(data.narrative.summary)}</p>
          ${renderList("Strengths", data.narrative.strengths)}
          ${renderList("Concerns", data.narrative.concerns)}
          ${renderList("Recommendations", data.narrative.recommendations)}
          <p><strong>Recurring themes:</strong> ${data.narrative.recurringThemes.map(escapeHtml).join(", ") || "No recurring themes yet"}</p>
          ${renderOutliers(data.narrative.outliers)}
        `;
        document.getElementById("scorecard").innerHTML = data.decisionScorecard.map((item) => `
          <div class="metric">
            <h3>${escapeHtml(item.memberName)}</h3>
            <p>${escapeHtml(item.readiness)} readiness</p>
            <p>${escapeHtml(item.fit)} fit</p>
            <p class="${riskClass(item.risk)}">${escapeHtml(item.risk)} risk</p>
            <p>${escapeHtml(item.suggestedAction)}</p>
          </div>
        `).join("");
      }

      function renderEmpty(message) {
        document.getElementById("title").textContent = "Peer Review Dashboard";
        document.getElementById("meta").textContent = "";
        document.getElementById("summary").innerHTML = `<div class="empty">${escapeHtml(message)}</div>`;
        document.getElementById("matrix").innerHTML = "";
        document.getElementById("narrative").innerHTML = `<div class="empty">${escapeHtml(message)}</div>`;
        document.getElementById("scorecard").innerHTML = "";
      }

      function renderDimensionTags(dimensions) {
        return dimensions.map((item) => `<span class="tag">${escapeHtml(item.name)} ${escapeHtml(item.averageDisplay)}</span>`).join("") || "No data";
      }

      function renderList(label, items) {
        if (!items.length) return `<p><strong>${label}:</strong> No entries yet.</p>`;
        return `<p><strong>${label}:</strong></p><ul>${items.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>`;
      }

      function renderOutliers(outliers) {
        if (!outliers.length) return `<p><strong>Outliers:</strong> None detected.</p>`;
        return `<p><strong>Outliers:</strong></p><ul>${outliers.map((item) => (
          `<li>${escapeHtml(item.memberName)} (${escapeHtml(item.averageDisplay)} avg): ${escapeHtml(item.reason)}</li>`
        )).join("")}</ul>`;
      }

      function riskClass(risk) {
        if (risk === "High") return "risk-high";
        if (risk === "Medium") return "risk-medium";
        if (risk === "Low") return "risk-low";
        return "";
      }

      projectSelect.addEventListener("change", () => {
        if (projectSelect.value) loadDashboard(projectSelect.value);
      });
      refreshButton.addEventListener("click", () => {
        if (projectSelect.value) loadDashboard(projectSelect.value);
      });
      loadProjects().catch((error) => renderEmpty(error.message));
    </script>
  </body>
</html>
